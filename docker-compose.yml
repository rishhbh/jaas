version: '3.8'

services:
  jaas-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jaas-backend-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/auth/me || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
